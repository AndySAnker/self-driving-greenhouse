<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who is in the room?</title>
<meta name="description" content="Four quick questions. Your answers appear live, anonymously, on the screen in the lecture hall.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Audience poll for the lecture slides. Answers go to a live relay (ntfy.sh) under the room name;
   the "Who is here?" slide listens to the same room. Anonymous: a random id per phone, no names. */
:root{--bg:#14231A;--card:#1d2f24;--line:#33443a;--ink:#F4F1E8;--muted:#C9D6C4;--gold:#E8B92E;--green:#7fd650;
  --q1:#E8B92E;--q2:#5fd3e8;--q3:#d685ff;--q4:#7fd650;--f:"Lexend","Verdana",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:28px;line-height:1.2}
.sub{margin:4px 0 0;color:var(--muted);font-size:16px}
fieldset{border:0;margin:0;padding:16px;background:var(--card);border-radius:16px;border-left:6px solid var(--c)}
legend{float:left;width:100%;padding:0 0 10px;font-weight:600;font-size:19px}
.opts{clear:both;display:flex;flex-wrap:wrap;gap:8px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0;margin:0}
.opts span{display:block;padding:11px 15px;border:2px solid var(--line);border-radius:999px;font-size:17px;cursor:pointer;user-select:none;transition:transform .1s}
.opts input:checked+span{background:var(--c);border-color:var(--c);color:#14231A;font-weight:600}
.opts input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.opts span:active{transform:scale(.96)}
button{font:inherit;font-weight:700;font-size:20px;padding:15px;border:0;border-radius:14px;background:var(--gold);color:#14231A;cursor:pointer}
button:disabled{opacity:.45}
.done{display:none;text-align:center;padding:30px 10px;gap:12px;flex-direction:column;align-items:center}
.done.on{display:flex}
.done .big{font-size:64px;line-height:1}
.done p{margin:0;font-size:20px}
.small{font-size:14px;color:var(--muted);text-align:center;margin:0}
a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Who is in the room?</h1>
    <p class="sub">Four taps. Your answers appear live on the big screen. Anonymous.</p>
  </header>
  <form id="f">
    <div style="display:flex;flex-direction:column;gap:16px">
      <fieldset style="--c:var(--q1)"><legend>1 · Who are you?</legend><div class="opts" data-q="who"></div></fieldset>
      <fieldset style="--c:var(--q2)"><legend>2 · Your field</legend><div class="opts" data-q="field"></div></fieldset>
      <fieldset style="--c:var(--q3)"><legend>3 · Your main interest</legend><div class="opts" data-q="interest"></div></fieldset>
      <fieldset style="--c:var(--q4)"><legend>4 · Experience with self-driving labs</legend><div class="opts" data-q="exp"></div></fieldset>
      <button id="send" type="submit" disabled>Send</button>
      <p class="small" id="msg">Answer all four to send.</p>
    </div>
  </form>
  <section class="done" id="done" aria-live="polite">
    <div class="big">🚀</div>
    <p><b>Thank you!</b> Look at the big screen.</p>
    <p class="small">Changed your mind? <a href="#" id="again">Change your answers</a></p>
  </section>
</main>
<script>
"use strict";
/* the same lists, in the same order, are in the "Who is here?" slide */
const QUESTIONS={
  who:["BSc","MSc","PhD","Postdoc","Professor","Other"],
  field:["Chemistry","Materials","Physics","Computer science","Engineering","Life sciences","Other"],
  interest:["Automation & robotics","AI & machine learning","Natural sciences"],
  exp:["New to it","Read about it","Used ML or automation","Built or run one"],
};
const q=k=>{try{return new URLSearchParams(location.search).get(k)}catch(e){return null}};
const room=(q("room")||"aalto-bf9c94").toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,40);
const URL_="https://ntfy.sh/sdl-poll-"+room;
let id;try{id=localStorage.getItem("sdl-poll-id")}catch(e){}
if(!id){id=Math.random().toString(36).slice(2,12);try{localStorage.setItem("sdl-poll-id",id)}catch(e){}}

for(const [k,opts] of Object.entries(QUESTIONS)){
  document.querySelector(`[data-q="${k}"]`).innerHTML=opts.map((o,i)=>`<label><input type="radio" name="${k}" value="${i}"><span>${o}</span></label>`).join("");
}
const form=document.getElementById("f"),send=document.getElementById("send"),msg=document.getElementById("msg");
const answers=()=>Object.fromEntries(Object.keys(QUESTIONS).map(k=>{const c=form.querySelector(`input[name="${k}"]:checked`);return [k,c?+c.value:null]}));
form.addEventListener("change",()=>{const a=answers(),left=Object.values(a).filter(v=>v===null).length;send.disabled=!!left;msg.textContent=left?`${left} to go.`:"Ready."});
async function relay(body){
  for(let k=0;k<3;k++){try{const r=await fetch(URL_,{method:"POST",body:JSON.stringify(body)});if(r.ok)return true}catch(e){}
    await new Promise(res=>setTimeout(res,1500*(k+1)))}
  return false;
}
form.addEventListener("submit",async ev=>{
  ev.preventDefault();send.disabled=true;send.textContent="Sending…";
  const ok=await relay(Object.assign({id},answers()));
  send.textContent="Send";
  if(ok){form.style.display="none";document.getElementById("done").classList.add("on")}
  else{send.disabled=false;msg.textContent="Could not send. Check the Wi-Fi and try again."}
});
document.getElementById("again").onclick=e=>{e.preventDefault();document.getElementById("done").classList.remove("on");form.style.display=""};
</script>
</body>
</html>
